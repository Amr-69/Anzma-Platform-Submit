<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Anzma AI Insight</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f4f6f8;
      color: #17202a;
    }
    header {
      background: #10375c;
      color: white;
      padding: 20px 32px;
    }
    header h1 { margin: 0; font-size: 24px; }
    header p { margin: 6px 0 0; opacity: .8; }
    main {
      max-width: 1100px;
      margin: 24px auto;
      padding: 0 20px;
    }
    .card {
      background: white;
      border-radius: 10px;
      padding: 20px;
      margin-bottom: 20px;
      box-shadow: 0 2px 8px rgba(0,0,0,.08);
    }
    h2 { margin-top: 0; font-size: 18px; }
    .row { display: flex; gap: 10px; flex-wrap: wrap; }
    input {
      flex: 1;
      min-width: 280px;
      padding: 12px;
      border: 1px solid #ccd4dc;
      border-radius: 6px;
      font-size: 15px;
    }
    button {
      padding: 12px 20px;
      border: 0;
      border-radius: 6px;
      background: #0b6e4f;
      color: white;
      font-size: 15px;
      cursor: pointer;
    }
    button:disabled { opacity: .6; cursor: not-allowed; }
    .answer {
      background: #eef7f2;
      border-left: 4px solid #0b6e4f;
      padding: 14px;
      border-radius: 6px;
      white-space: pre-wrap;
    }
    .badge {
      display: inline-block;
      padding: 4px 10px;
      border-radius: 999px;
      font-size: 12px;
      font-weight: bold;
    }
    .validated { background: #d9f2e5; color: #14603f; }
    .not-validated { background: #fdecea; color: #a53225; }
    .fallback { background: #fff4d6; color: #7a5b00; }
    ul { padding-left: 20px; }
    .muted { color: #66707a; font-size: 14px; }
    .error {
      background: #fdecea;
      color: #a53225;
      padding: 12px;
      border-radius: 6px;
    }
  </style>
</head>
<body>
  <header>
    <h1>Anzma AI Insight</h1>
    <p>Operational intelligence for smart buildings</p>
  </header>


  <main>
    <section class="card">
      <h2>Ask Anzma AI</h2>
      <div class="row">
        <input id="question" value="Why is CRAC 1 temperature high?" />
        <button id="ask-live-button">Live model</button>
        <button id="ask-fallback-button">Deterministic fallback</button>
      </div>
      <p class="muted">
        Day 2 demo: CRAC, HVAC, temperature, and cooling questions are supported.
      </p>
    </section>


    <section class="card" id="result-card" style="display:none">
      <h2>Operational answer</h2>
      <div id="badges"></div>
      <div id="answer" class="answer"></div>


      <h3>Supporting evidence</h3>
      <div id="evidence" class="muted"></div>


      <h3>Recommended actions</h3>
      <ul id="recommendations"></ul>


      <h3>Limitations</h3>
      <div id="limitations" class="muted"></div>
    </section>


    <section class="card">
      <h2>Open incidents</h2>
      <div id="incidents" class="muted">Loading incidents…</div>
    </section>
  </main>


  <script>
    const questionInput = document.getElementById("question");
    const askLiveButton = document.getElementById("ask-live-button");
    const askFallbackButton = document.getElementById("ask-fallback-button");
    const resultCard = document.getElementById("result-card");
    const badges = document.getElementById("badges");
    const answer = document.getElementById("answer");
    const evidence = document.getElementById("evidence");
    const recommendations = document.getElementById("recommendations");
    const limitations = document.getElementById("limitations");
    const incidents = document.getElementById("incidents");


    async function loadIncidents() {
      try {
        const response = await fetch("/incidents");
        const data = await response.json();
        incidents.innerHTML = "";


        if (!data.incidents || data.incidents.length === 0) {
          incidents.textContent = "No incidents are currently available.";
          return;
        }


        for (const incident of data.incidents) {
          const item = document.createElement("div");
          item.style.marginBottom = "12px";
          item.innerHTML = `
            <strong>${incident.title}</strong><br>
            <span class="muted">
              ${incident.severity} · ${incident.status} · ${incident.building} · ${incident.zone}
            </span>
          `;
          incidents.appendChild(item);
        }
      } catch (error) {
        incidents.textContent = "Unable to load incidents.";
      }
    }


    async function runAsk(useLlm, button) {
      const question = questionInput.value.trim();
      if (!question) return;


      const originalText = button.textContent;
      button.disabled = true;
      button.textContent = "Analyzing…";
      resultCard.style.display = "none";


      try {
        const response = await fetch("/ask", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            question: question,
            use_llm: useLlm
          })
        });


        const data = await response.json();


        if (!response.ok) {
          throw new Error(data.detail || "The request failed.");
        }


        const validationLabel =
          data.validation.status === "validated"
            ? "grounding checks passed"
            : data.validation.status;


        badges.innerHTML = `
          <span class="badge ${data.validation.status === "validated" ? "validated" : "not-validated"}">
            ${validationLabel}
          </span>
          <span class="badge fallback">${data.ai_source}</span>
          <span class="badge fallback">${data.data_sufficiency}</span>
        `;


        if (data.model_used) {
          badges.innerHTML += `
            <span class="badge fallback">model: ${data.model_used}</span>
          `;
        }


        answer.textContent = data.answer;


        evidence.innerHTML = data.evidence.length
          ? data.evidence.map(item => `
              <div>
                <strong>${item.ref}</strong> ·
                ${item.event_type} ·
                ${item.value ?? ""} ${item.unit ?? ""} ·
                ${item.ts}
              </div>
            `).join("")
          : "No evidence is available for this answer.";


        recommendations.innerHTML = data.recommendations.length
          ? data.recommendations.map(item => `
              <li>
                <strong>${item.action_id}</strong> — ${item.text}
                <br>
                <span class="muted">Priority ${item.priority} · ${item.derived_by}</span>
              </li>
            `).join("")
          : "<li>No approved recommendation is available.</li>";


        const esc = t => String(t).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
        const lines = data.limitations.map(item => `<div>• ${esc(item)}</div>`);
        const diag = data.diagnostics || {};
        if (diag.llm_attempted && data.ai_source === "fallback") {
          const rej = (diag.rejected_answers || []).map(r => `attempt ${r.attempt}: ${esc((r.violations || []).join("; "))}`).join(" | ");
          const why = [diag.llm_error ? esc(diag.llm_error) : "", rej].filter(Boolean).join(" - ");
          lines.push(`<div class="muted"><strong>Live model diagnostic:</strong> ${why || "no detail recorded"}</div>`);
        }
        limitations.innerHTML = lines.length ? lines.join("") : "No limitations reported.";


        resultCard.style.display = "block";
        loadIncidents();
      } catch (error) {
        resultCard.style.display = "block";
        badges.innerHTML = "";
        answer.innerHTML = `<div class="error">${error.message}</div>`;
        evidence.innerHTML = "";
        recommendations.innerHTML = "";
        limitations.innerHTML = "";
      } finally {
        button.disabled = false;
        button.textContent = originalText;
      }
    }


    askLiveButton.addEventListener("click", () => runAsk(true, askLiveButton));
    askFallbackButton.addEventListener("click", () => runAsk(false, askFallbackButton));


    loadIncidents();
  </script>
</body>
</html>
